name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: System dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: Formatting
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -trimpath -o artifactvault ./cmd/artifactvault
      - name: Migration rehearsal
        run: |
          export ARTIFACTVAULT_DB_PATH="$RUNNER_TEMP/migration.db"
          export ARTIFACTVAULT_STORAGE_ROOT="$RUNNER_TEMP/storage"
          ./artifactvault migrate up
          test "$(./artifactvault migrate version)" = "2"
          ./artifactvault migrate down
          test "$(./artifactvault migrate version)" = "1"
          ./artifactvault migrate down
          test "$(./artifactvault migrate version)" = "0"
          ./artifactvault migrate up
          test "$(./artifactvault migrate version)" = "2"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Build image
        run: docker build -t artifactvault:ci .
      - name: Boot image and verify readiness
        run: |
          docker run -d --name artifactvault-ci -p 127.0.0.1:18080:8080 artifactvault:ci
          trap 'docker logs artifactvault-ci || true; docker rm -f artifactvault-ci || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1
