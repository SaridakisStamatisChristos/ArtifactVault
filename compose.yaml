services:
  artifactvault:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.example
    volumes:
      - artifactvault-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/artifactvault", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  artifactvault-data:
